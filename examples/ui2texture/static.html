<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>static</title>
<!--
  TV static, 2026-09-06. The two-second "signal lost" the car wears between skins: the
  skin switcher (fn_reskinBurst.sqf) paints this page onto every hidden selection through
  UI-on-texture (display webui_uiTexStatic), pumps it for two seconds, then lets the real skin land.
  Opaque on purpose -- it has to cover the old paint completely, or the swap reads as a fade.
  Self-contained: the browser sandbox forbids fetch, fonts and external files.
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<script>
(function () {
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var W = cv.width, H = cv.height, img = ctx.createImageData(W, H), d = img.data, frame = 0;
  function tick() {
    frame++;
    // white noise, slightly blue like a dead channel, with a dark rolling bar
    var bar = (frame * 3) % (H + 40) - 20;
    for (var y = 0; y < H; y++) {
      var dim = (y > bar - 10 && y < bar + 10) ? 0.35 : 1;
      for (var x = 0; x < W; x++) {
        var i = (y * W + x) * 4, v = (Math.random() * 255) | 0;
        d[i] = v * dim; d[i + 1] = v * dim; d[i + 2] = Math.min(255, v * 1.15) * dim; d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
